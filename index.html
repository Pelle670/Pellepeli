<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crate Rush</title>
<style>
:root{--bg:#0c0f18;--panel:#151a28;--line:#2b3247;--text:#e8ecf5;--dim:#8d96ad;--gold:#ffc94a;
--common:#b4b4b4;--uncommon:#4fc36b;--rare:#3f8cff;--legendary:#a54dff;--godly:#ff3d5a;--chroma:#ff4de1}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font-family:"Trebuchet MS",Verdana,sans-serif;min-height:100vh;
background:radial-gradient(900px 420px at 50% -80px,#3b2a7a66,transparent),radial-gradient(700px 400px at 100% 100%,#7a2a4a33,transparent),var(--bg)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-bottom:1px solid var(--line);background:#0c0f18cc;flex-wrap:wrap;gap:10px}
h1{margin:0;font:700 1.6rem Georgia,serif;letter-spacing:.18em;text-transform:uppercase;background:linear-gradient(90deg,#ffe49a,#ff9f43);-webkit-background-clip:text;background-clip:text;color:transparent}
.wallet{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 16px}
.coins{font-size:1.15rem;font-weight:bold;color:var(--gold)}
.coins::before{content:"";display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#e0a01a);margin-right:8px;vertical-align:-2px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 18px;background:linear-gradient(180deg,#4f9bff,#2f6fe0);color:#fff;font-weight:bold;transition:transform .1s,filter .15s}
button:hover{filter:brightness(1.15);transform:translateY(-1px)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.ghost{background:#262d44;font-size:.85rem;padding:8px 14px}
main{max-width:980px;margin:0 auto;padding:22px}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.box{background:linear-gradient(180deg,#1b2136,#121624);border:2px solid var(--line);border-radius:16px;padding:18px;text-align:center;transition:transform .2s,box-shadow .2s}
.box:hover{transform:translateY(-3px)}
.box.sel{border-color:var(--c);box-shadow:0 0 28px color-mix(in srgb,var(--c) 40%,transparent)}
.chest{width:92px;height:92px;filter:drop-shadow(0 0 12px var(--c))}
.box h3{margin:6px 0 2px;font-family:Georgia,serif;letter-spacing:.05em}
.box small{color:var(--gold);font-weight:bold}
.odds{font-size:.74rem;color:var(--dim);margin:8px 0 10px;min-height:46px}
#stage{margin:24px 0;background:linear-gradient(180deg,#171c2e,#0f1320);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center;box-shadow:0 10px 40px #0008}
#view{position:relative;overflow:hidden;height:172px;border-radius:12px;background:#080a11;border:1px solid var(--line);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
#view::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--gold);box-shadow:0 0 14px var(--gold);z-index:2}
#strip{display:flex;gap:8px;padding:8px;position:absolute;left:0;top:0;will-change:transform}
.it{flex:0 0 120px;height:156px;border-radius:10px;border:1px solid color-mix(in srgb,var(--c) 45%,#222);border-bottom:5px solid var(--c);background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--c) 30%,transparent),transparent 70%),#141929;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;text-align:center}
.it svg{width:76px;height:76px}
.it b{font-size:.68rem;line-height:1.15;margin-top:4px}
.tag{font-size:.6rem;color:var(--c);text-transform:uppercase;letter-spacing:.1em;font-style:normal;margin-top:3px}
.w{filter:drop-shadow(0 0 5px var(--c))}
.w.legendary,.w.godly{filter:drop-shadow(0 0 10px var(--c))}
#result{min-height:30px;margin:14px 0;font-size:1.1rem}
h2{margin:28px 0 12px;font:700 1.1rem Georgia,serif;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
#inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.inv{background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c) 25%,transparent),transparent 70%),var(--panel);border:1px solid color-mix(in srgb,var(--c) 40%,#222);border-bottom:5px solid var(--c);border-radius:10px;padding:10px;text-align:center;font-size:.76rem}
.inv svg{width:64px;height:64px}
.inv b{display:block;margin-top:2px}
.inv button{margin-top:6px;padding:5px 10px;font-size:.72rem}
.it.dim{opacity:.3;transition:opacity .4s}
.it.win{animation:winpulse .7s ease-in-out 3}
@keyframes winpulse{50%{transform:scale(1.1);box-shadow:0 0 30px var(--c)}}
#reveal{position:fixed;inset:0;background:rgba(5,7,12,.9);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:10;text-align:center;padding:20px}
#reveal.on{display:flex}
#reveal .big svg{width:220px;height:220px;animation:pop .6s cubic-bezier(.2,1.6,.4,1);filter:drop-shadow(0 0 28px var(--c))}
#reveal .glow{position:absolute;width:480px;height:480px;border-radius:50%;background:conic-gradient(from 0deg,transparent,var(--c),transparent,var(--c),transparent);opacity:.3;filter:blur(30px);animation:spin 6s linear infinite}
#reveal .rar{font:700 1.6rem Georgia,serif;letter-spacing:.2em;text-transform:uppercase;color:var(--c);z-index:1}
#reveal .nm{font-size:1.15rem;margin:6px 0 18px;z-index:1}
#reveal button{z-index:1}
@keyframes pop{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
#preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
#preview .it{flex:none}
.mys{border-color:#3a4160;border-bottom-color:#5b6385;background:radial-gradient(circle at 50% 35%,#2a2f4a,transparent 70%),#141929}
.mys .q{font:700 2.6rem Georgia,serif;color:#7d86a8;height:76px;line-height:76px}
@keyframes chroma{to{filter:hue-rotate(360deg)}}
.it.r-chroma,.inv.r-chroma,#reveal.r-chroma .big,#reveal.r-chroma .rar{animation:chroma 3s linear infinite}
.it.r-chroma.win{animation:chroma 3s linear infinite,winpulse .7s ease-in-out 3}
@media (prefers-reduced-motion:reduce){#reveal .big svg,#reveal .glow,.it.win,.it.r-chroma,.inv.r-chroma,#reveal.r-chroma .big,#reveal.r-chroma .rar{animation:none}}
</style>
</head>
<body>
<header>
  <h1>Crate Rush</h1>
  <div class="wallet"><span class="coins" id="coins">0</span>
  <button class="ghost" id="free">+ Free coins</button></div>
</header>
<main>
  <div class="boxes" id="boxes"></div>
  <h2>This box can drop</h2>
  <div id="preview"></div>
  <div id="stage">
    <div id="view"><div id="strip"></div></div>
    <div id="result">Pick a box and press Open.</div>
    <button id="open">Open box</button>
  </div>
  <h2>Your inventory (<span id="count">0</span>)</h2>
  <div id="inv"></div>
</main>
<div id="reveal"></div>
<script>
// ===== SETTINGS: roll time in milliseconds (1000 = 1 second) =====
const ROLL_FIRST = 3500;   // first number: used on devices with "reduce motion" turned on
const ROLL_SECOND = 6600;  // second number: used for everyone else
// ==================================================================
const RARITY = {
  common:{c:"var(--common)",hex:"#b4b4b4",label:"Common"},
  uncommon:{c:"var(--uncommon)",hex:"#4fc36b",label:"Uncommon"},
  rare:{c:"var(--rare)",hex:"#3f8cff",label:"Rare"},
  legendary:{c:"var(--legendary)",hex:"#a54dff",label:"Legendary"},
  godly:{c:"var(--godly)",hex:"#ff3d5a",label:"Godly"},
  chroma:{c:"var(--chroma)",hex:"#ff4de1",label:"Chroma"}
};
const ORDER=["common","uncommon","rare","legendary","godly","chroma"];
const HIDDEN=["godly","chroma"];   // shown as "???" before opening
const GUNS=["luger","revolver","flintlock"];
// Items: name, shape, rarity, sell value. Knife shapes: dagger/curved/sword/axe/scythe. Gun shapes: luger/revolver/flintlock
const ITEMS = [
  ["Gretel's Oven Knife","dagger","common",10],["Woodcutter's Hatchet","axe","common",12],
  ["Briar Rose Thorn","curved","uncommon",45],["Baba Yaga's Cleaver","axe","uncommon",55],["Pied Piper's Flintlock","flintlock","uncommon",50],
  ["Snow Queen's Shard","dagger","rare",150],["Jabberwock's Vorpal Blade","sword","rare",170],["Huntsman's Revolver","revolver","rare",160],["Puss in Boots' Flintlock","flintlock","rare",180],
  ["Excalibur","sword","legendary",1400],["Spindle of Sleeping Death","luger","legendary",1500],
  ["Reaper of Ragnarök","scythe","godly",6000],["Fafnir's Fire Luger","luger","godly",6500],
  ["Bifröst Blade","sword","chroma",18000],["Northern Lights Luger","luger","chroma",20000]
].map(([name,shape,rarity,value])=>({name,shape,rarity,value,kind:GUNS.includes(shape)?"gun":"knife"}));

// Boxes: price, which items it holds (all/knife/gun) and rarity chances (% — they add up to 100)
const BOXES = [
  {id:"basic",name:"Basic Box",price:100,color:"#b4b4b4",kind:"all",w:{common:60,uncommon:26,rare:11.4,legendary:2,godly:0.5,chroma:0.1}},
  {id:"knife",name:"Knife Box",price:450,color:"#3f8cff",kind:"knife",w:{common:15,uncommon:35,rare:35,legendary:11,godly:3.5,chroma:0.5}},
  {id:"gun",name:"Gun Box",price:800,color:"#a54dff",kind:"gun",w:{uncommon:20,rare:55,legendary:18,godly:6,chroma:1}}
];
const poolOf = b => ITEMS.filter(i=>b.kind==="all"||i.kind===b.kind);

// Weapon art: drawn as SVG so it needs no image files
const M="#e6ecf7", WD="#6b4a2f";
const SHAPES={
  dagger:a=>`<polygon points="50,6 58,52 42,52" fill="${M}" stroke="${a}" stroke-width="2"/><rect x="34" y="52" width="32" height="7" rx="2" fill="${a}"/><rect x="46" y="59" width="8" height="18" fill="${WD}"/><circle cx="50" cy="81" r="5" fill="${a}"/>`,
  curved:a=>`<path d="M50 4 Q78 34 58 62 L44 62 Q56 34 50 4Z" fill="${M}" stroke="${a}" stroke-width="2"/><rect x="36" y="62" width="30" height="6" rx="2" fill="${a}"/><rect x="46" y="68" width="8" height="18" fill="${WD}"/><circle cx="50" cy="90" r="4" fill="${a}"/>`,
  sword:a=>`<polygon points="50,2 58,62 42,62" fill="${M}" stroke="${a}" stroke-width="2"/><line x1="50" y1="10" x2="50" y2="58" stroke="${a}" stroke-width="2" opacity=".6"/><polygon points="28,62 72,62 66,70 34,70" fill="${a}"/><rect x="46" y="70" width="8" height="18" fill="${WD}"/><circle cx="50" cy="92" r="5" fill="${a}"/>`,
  axe:a=>`<rect x="47" y="8" width="6" height="86" rx="2" fill="${WD}"/><path d="M53 14 L84 22 L84 54 L53 48Z" fill="${M}" stroke="${a}" stroke-width="2.5"/><path d="M47 20 L36 26 L36 40 L47 38Z" fill="${a}"/>`,
  scythe:a=>`<rect x="47" y="8" width="6" height="86" rx="2" fill="${WD}"/><path d="M53 10 Q100 4 90 50 Q80 26 53 26Z" fill="${M}" stroke="${a}" stroke-width="2.5"/>`,
  luger:a=>`<rect x="12" y="26" width="68" height="15" rx="3" fill="${M}" stroke="${a}" stroke-width="2.5"/><rect x="78" y="29" width="16" height="9" rx="2" fill="${M}" stroke="${a}" stroke-width="2"/><rect x="12" y="32" width="68" height="3" fill="${a}"/><polygon points="20,41 44,41 40,80 20,80" fill="${WD}" stroke="#2b1b0e" stroke-width="1.5"/><path d="M46 41 v10 q-6 0 -6 8" fill="none" stroke="${a}" stroke-width="3"/>`,
  revolver:a=>`<rect x="40" y="27" width="54" height="9" rx="2" fill="${M}" stroke="${a}" stroke-width="2"/><circle cx="38" cy="36" r="13" fill="${M}" stroke="${a}" stroke-width="3"/><circle cx="38" cy="36" r="4" fill="${a}"/><rect x="14" y="24" width="16" height="10" rx="3" fill="${a}"/><polygon points="18,46 36,46 30,82 12,78" fill="${WD}" stroke="#2b1b0e" stroke-width="1.5"/>`,
  flintlock:a=>`<rect x="34" y="30" width="58" height="7" rx="2" fill="${M}" stroke="${a}" stroke-width="2"/><path d="M12 28 L38 26 L40 44 L26 48Z" fill="${a}"/><polygon points="14,40 32,44 24,80 6,72" fill="${WD}" stroke="#2b1b0e" stroke-width="1.5"/><path d="M12 26 q6-8 14-4" fill="none" stroke="${M}" stroke-width="3"/>`
};
function weapon(it){
  const a=RARITY[it.rarity].hex, rot=GUNS.includes(it.shape)?"":' transform="rotate(35 50 50)"';
  return `<svg viewBox="0 0 100 100" class="w ${it.rarity}" style="--c:${a}"><g${rot}>${(SHAPES[it.shape]||SHAPES.sword)(a)}</g></svg>`;
}
const chest=c=>`<svg viewBox="0 0 100 100" class="chest" style="--c:${c}"><rect x="12" y="42" width="76" height="44" rx="6" fill="#2a2f44" stroke="${c}" stroke-width="4"/><path d="M12 48 Q50 12 88 48Z" fill="#3a4160" stroke="${c}" stroke-width="4"/><rect x="12" y="56" width="76" height="6" fill="${c}"/><rect x="43" y="52" width="14" height="18" rx="3" fill="${c}"/><circle cx="50" cy="61" r="3" fill="#10131c"/></svg>`;

let state = {coins:500, inv:[]};
try{const s=JSON.parse(localStorage.getItem("crateRush"));if(s&&typeof s.coins==="number")state=s}catch(e){}
state.inv=(state.inv||[]).map(i=>ITEMS.find(x=>x.name===i.name)||ITEMS.find(x=>x.rarity===i.rarity)).filter(Boolean);
const save=()=>{try{localStorage.setItem("crateRush",JSON.stringify(state))}catch(e){}};

let selected = BOXES[0], busy = false;
const $ = id => document.getElementById(id);

function roll(box){
  const pool = poolOf(box);
  const entries = pool.map(it=>({it,w:(box.w[it.rarity]||0)/pool.filter(x=>x.rarity===it.rarity).length}));
  let total = entries.reduce((a,e)=>a+e.w,0), r = Math.random()*total;
  for(const e of entries){ if((r-=e.w)<0) return e.it; }
  return entries[0].it;
}
function oddsText(box){
  const t = Object.values(box.w).reduce((a,b)=>a+b,0);
  return Object.entries(box.w).filter(([,v])=>v>0).map(([k,v])=>RARITY[k].label+" "+(v/t*100).toFixed(1).replace(/\.0$/,"")+"%").join(", ");
}
function cardHTML(it,cls){
  return `<div class="${cls} r-${it.rarity}" style="--c:${RARITY[it.rarity].c}">${weapon(it)}<b>${it.name}</b><i class="tag">${RARITY[it.rarity].label}</i></div>`;
}
function renderBoxes(){
  $("boxes").innerHTML = "";
  BOXES.forEach(b=>{
    const d = document.createElement("div");
    d.className = "box"+(b===selected?" sel":"");
    d.style.setProperty("--c",b.color);
    d.innerHTML = `${chest(b.color)}<h3>${b.name}</h3><small>${b.price.toLocaleString()} coins</small><div class="odds">${oddsText(b)}</div>`;
    const btn = document.createElement("button");
    btn.textContent = b===selected?"Selected":"Select";
    btn.className = "ghost";
    btn.onclick = ()=>{ if(!busy){selected=b;renderBoxes()} };
    d.appendChild(btn);
    $("boxes").appendChild(d);
  });
  if(!busy) fillIdle();
  renderPreview();
  $("open").textContent = "Open "+selected.name+" ("+selected.price.toLocaleString()+")";
}
function renderInv(){
  $("coins").textContent = state.coins.toLocaleString();
  $("count").textContent = state.inv.length;
  $("inv").innerHTML = "";
  state.inv.forEach((it,i)=>{
    const d = document.createElement("div");
    d.className = "inv r-"+it.rarity; d.style.setProperty("--c",RARITY[it.rarity].c);
    d.innerHTML = `${weapon(it)}<b>${it.name}</b><i class="tag">${RARITY[it.rarity].label}</i><br>`;
    const b = document.createElement("button");
    b.textContent = "Sell "+it.value.toLocaleString();
    b.className = "ghost";
    b.onclick = ()=>{ if(busy)return; state.coins+=it.value; state.inv.splice(i,1); save(); renderInv(); };
    d.appendChild(b);
    $("inv").appendChild(d);
  });
  $("open").disabled = busy || state.coins < selected.price;
  save();
}

let audio;
function tick(freq,dur,vol){
  try{
    audio = audio || new (window.AudioContext||window.webkitAudioContext)();
    const o=audio.createOscillator(), g=audio.createGain();
    o.frequency.value=freq; o.type="square"; g.gain.value=vol;
    g.gain.exponentialRampToValueAtTime(0.0001,audio.currentTime+dur);
    o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime+dur);
  }catch(e){}
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));

function renderPreview(){
  const items = poolOf(selected).sort((a,b)=>ORDER.indexOf(a.rarity)-ORDER.indexOf(b.rarity));
  $("preview").innerHTML = items.map(it=>HIDDEN.includes(it.rarity)
    ? `<div class="it mys"><div class="q">?</div><b>???</b><i class="tag">Mystery</i></div>`
    : cardHTML(it,"it")).join("");
}
function fillIdle(){
  const strip=$("strip");
  strip.style.transform="translateX(0)";
  strip.innerHTML = (()=>{const v=poolOf(selected).filter(i=>!HIDDEN.includes(i.rarity));return Array.from({length:14},()=>cardHTML(v[Math.floor(Math.random()*v.length)],"it")).join("")})();
}

async function open(){
  if(busy || state.coins < selected.price) return;
  busy = true;
  state.coins -= selected.price;
  const N = 80, W = 128;
  const WIN = 62 + Math.floor(Math.random()*8);   // roughly where it stops; the item is NOT chosen yet
  const strip = $("strip"), view = $("view");
  renderInv();
  $("result").textContent = "Rolling...";

  const rolled = [];
  for(let i=0;i<N;i++) rolled.push(roll(selected));
  strip.style.transform = "translateX(0)";
  strip.innerHTML = rolled.map(it=>cardHTML(it,"it")).join("");
  const cards = strip.children;
  const center = view.clientWidth/2;
  const jitter = (Math.random()-0.5)*90;           // stops anywhere inside the card
  const target = -(WIN*W + 8 + 60) + center + jitter;
  const T = matchMedia("(prefers-reduced-motion: reduce)").matches ? ROLL_FIRST : ROLL_SECOND;
  const ease = p => 1 - Math.pow(1-p, 2);          // steadier spin, slows near the end

  let last = -1;
  await new Promise(done=>{
    const t0 = performance.now();
    (function frame(now){
      const p = Math.min(1,(now-t0)/T);
      const x = target*ease(p);
      strip.style.transform = "translate3d("+x+"px,0,0)";
      const idx = Math.floor((center - x - 8)/W);
      if(idx !== last && rolled[idx]){
        tick(480+(idx%4)*50,.05,.05);
        $("result").innerHTML = `<b style="color:${RARITY[rolled[idx].rarity].c}">${rolled[idx].name}</b>`;
        last = idx;
      }
      if(p<1) requestAnimationFrame(frame); else done();
    })(t0);
  });

  // The prize is whatever card is under the marker when it stops
  const landed = Math.max(0, Math.min(N-1, Math.floor((center - target - 8)/W)));
  const prize = rolled[landed];
  for(let i=0;i<cards.length;i++) if(i!==landed) cards[i].classList.add("dim");
  cards[landed].classList.add("win");
  state.inv.push(prize);
  save();
  const hi = ["epic","legendary","godly"].includes(prize.rarity);
  tick(hi?880:660,.25,.12); if(hi){ setTimeout(()=>tick(1100,.3,.12),150); }
  await sleep(1400);

  const R = RARITY[prize.rarity];
  const rv = $("reveal");
  rv.style.setProperty("--c",R.c);
  rv.innerHTML = `<div class="glow"></div><div class="big">${weapon(prize)}</div><div class="rar">${R.label}</div><div class="nm">${prize.name} &middot; worth ${prize.value.toLocaleString()}</div><button id="ok">Nice!</button>`;
  rv.className = "r-"+prize.rarity+" on";
  $("ok").focus();
  $("ok").onclick = ()=>{
    rv.classList.remove("on");
    busy = false;
    $("result").innerHTML = `You got <b style="color:${R.c}">${prize.name}</b> (${R.label})!`;
    fillIdle();
    renderInv();
  };
}

$("open").onclick = open;
$("free").onclick = ()=>{ if(!busy){state.coins+=100; renderInv();} };
renderBoxes(); renderInv();
</script>
</body>
</html>
